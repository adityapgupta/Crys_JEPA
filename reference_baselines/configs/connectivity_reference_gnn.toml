# Connectivity reference GNN experiment.
# Varies the graph topology (who connects to whom); node features, pools, target,
# checkpoint rule and screening score are identical to the base reference GNN.
# Frozen before the reserved partition is opened. Do not edit after a full run.
status = "cluster_ready"

# gcn/gat/sage are the message-passing models; no_graph is the readout control
# (no propagation). The base trainer accepts all four as --model.
models = ["gcn", "gat", "sage"]
seeds = [2026, 2027, 2028]

hidden = 64
layers = 2
epochs = 20
early_stop_patience = 4
batch_size = 32
learning_rate = 0.001
weight_decay = 0.0001
retrieval_k = 5
train_limit = 0
validation_limit = 0
threads = 8
device = "cpu"

target = "Mapped reference appears in the saved fixed-hull decomposition of the candidate"
loss = "Reference-level binary cross entropy"
checkpoint_rule = "Lowest validation reference BCE; ties use the earlier epoch"

# Topologies. physical = decomposition co-occurrence (reference point);
# cosine = embedding-cosine kNN (redundancy control, the "embedding-space graph");
# soap = SOAP-geometry kNN (complementary); phase = hull tie-line adjacency
# (complementary). The no_graph readout control is the floor (no edges at all).
graph_primary = "physical"
graph_ablations = ["cosine", "soap", "phase"]

# Evaluation: the decisive contrast is each topology's GNN minus the no_graph
# readout, at the primary budget, with a paired chemical-system bootstrap.
primary_budget_percent = 5
bootstrap_draws = 1000
controls = ["no_graph_readout"]
evaluation = "Frozen checkpoint scored once on reserved rows; budgets 1, 2, 5, 7 percent"
claim_limit = "MatterSim proxy screen, not DFT confirmation; reserved rows are an engineering holdout"
